<div class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Create an account</h2>

    <div class="form-field">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" autocomplete="name" />
      @if (showError('name')) {
        <p class="error-text">Enter your name.</p>
      }
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
      @if (showError('email')) {
        <p class="error-text">Enter a valid email address.</p>
      }
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      @if (showError('password')) {
        <p class="error-text">Password must be at least 8 characters.</p>
      }
    </div>

    @if (errorMessage(); as error) {
      <p class="error-text">{{ error }}</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">Register</button>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </form>
</div>
