<header class="navbar">
  <span class="navbar-brand"
    ><span class="navbar-brand-word">Clock<span class="navbar-brand-accent">It</span></span></span
  >
  <nav class="navbar-links">
    <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page"
      >Time Tracker</a
    >
    <a routerLink="/projects" routerLinkActive="is-active" ariaCurrentWhenActive="page">Projects</a>
    <a routerLink="/reports" routerLinkActive="is-active" ariaCurrentWhenActive="page">Reports</a>
  </nav>
  <div class="navbar-user">
    @if (currentUser(); as user) {
      <div class="account-menu">
        <button
          class="account-menu-trigger"
          type="button"
          aria-haspopup="menu"
          [attr.aria-expanded]="isAccountMenuOpen()"
          (click)="toggleAccountMenu()"
        >
          {{ user.name }}
          <span aria-hidden="true">⌄</span>
        </button>
        @if (isAccountMenuOpen()) {
          <div class="account-menu-panel" role="menu">
            <a routerLink="/profile" role="menuitem" (click)="closeAccountMenu()">My account</a>
            @if (isAdmin()) {
              <a routerLink="/notifications" role="menuitem" (click)="closeAccountMenu()"
                >Notifications</a
              >
              <a routerLink="/users" role="menuitem" (click)="closeAccountMenu()">Manage users</a>
            }
            <button type="button" role="menuitem" (click)="logout()">Log out</button>
          </div>
        }
      </div>
    } @else {
      <span>Account</span>
    }
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
