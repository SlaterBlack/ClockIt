<div class="project-color-control" [class.is-compact]="compact">
  <button
    class="project-color"
    type="button"
    [style.background]="compact ? color : null"
    [attr.aria-label]="label"
    [attr.aria-expanded]="isOpen()"
    (click)="togglePicker()"
  >
    @if (!compact) {
      <span class="project-color-swatch" [style.background]="color"></span>
      <span>{{ displayLabel }}</span>
    }
  </button>
  @if (isOpen()) {
    <div class="color-popover" [attr.aria-label]="'Choose color for ' + displayLabel">
      <span class="color-popover-title">Project color</span>
      <div class="color-swatches">
        @for (option of colorOptions; track option.value) {
          <button
            class="color-swatch"
            type="button"
            [style.background]="option.value"
            [attr.aria-label]="option.name"
            [attr.title]="option.name"
            [attr.aria-pressed]="color.toUpperCase() === option.value"
            (click)="selectColor(option.value)"
          ></button>
        }
      </div>
      <label class="custom-color-option">
        <input
          type="color"
          [ngModel]="color"
          (ngModelChange)="selectColor($event)"
          [attr.aria-label]="'Choose custom color for ' + displayLabel"
        />
        <span>Choose custom color</span>
      </label>
    </div>
  }
</div>
