<div class="auth-page">
  <form
    class="card auth-card"
    [formGroup]="form"
    (ngSubmit)="submit()"
    aria-labelledby="login-title"
  >
    <a class="auth-brand" routerLink="/dashboard" aria-label="ClockIt home">
      <img src="/ClockItLogo_64.png" width="56" height="56" alt="">
      <span>Clock<span class="auth-brand-accent">It</span></span>
    </a>
    <h1 id="login-title">Log in</h1>

    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    @if (errorMessage(); as error) {
      <p class="error-text">{{ error }}</p>
    }

    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">Log in</button>
  </form>
</div>
