<header class="navbar">
  <span class="navbar-brand">Clockify Dupe</span>
  <nav class="navbar-links">
    <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page">Time Tracker</a>
    <a routerLink="/projects" routerLinkActive="is-active" ariaCurrentWhenActive="page">Projects</a>
  </nav>
  <div class="navbar-user">
    @if (currentUser(); as user) {
      <span>{{ user.name }}</span>
    }
    <button class="btn btn-secondary" type="button" (click)="logout()">Log out</button>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
